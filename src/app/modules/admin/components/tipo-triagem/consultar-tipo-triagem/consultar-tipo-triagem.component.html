<div class="container-fluid p-0">

    <h1 class="h3 mb-3">Cadastro do tipo de Triagem</h1>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Informe o nome do tipo de triagem para cadastro</h5>
                </div>
                <div class="card-body">
                    <div class="mt-3">
                        <!-- Spinner alinhado à esquerda -->
                        <app-spinner *ngIf="carregando" [show]="true" message="Salvando tipo de triagem..."
                            class="d-inline-block">
                        </app-spinner>

                        <!-- Alertas ocupando 100% da largura -->
                        <app-alerts *ngIf="!carregando && mensagemSucesso.length > 0" class="w-100" titulo="Sucesso!"
                            [mensagens]="mensagemSucesso" tipo="success" icone="fas fa-check-circle fa-lg">
                        </app-alerts>

                        <app-alerts *ngIf="!carregando && mensagemErro.length > 0" class="w-100" titulo="Erro!"
                            [mensagens]="mensagemErro" tipo="danger" icone="fas fa-times-circle fa-lg">
                        </app-alerts>
                    </div>
                   <table id="datatables-responsive" class="table table-striped w-100">
                        <thead>
                            <tr>
                                <th style="width:90%">Nome Triagem</th>
                                <th>Açoes</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let consultas of consulta">
                                <td>{{consultas.nomeTipoTriagem}}</td>
                                <td>
                                    <a [routerLink]="['/admin/editar-tipo-triagem', consultas.idTipoTriagem]">
                                        <i class="align-middle me-2 fas fa-fw fa-pencil-alt fa-lg"></i>
                                    </a>
                                    <button class="btn btn-link p-0"
                                        (click)="excluirTipoTriagem(consultas.idTipoTriagem)">
                                        <i class="align-middle me-2 fas fa-fw fa-trash-alt fa-lg text-danger"></i>
                                    </button>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
