<div
  *ngIf="mensagens.length > 0"
  class="alert alert-{{ tipo }} alert-outline-coloured alert-dismissible alert-com-progresso"
  role="alert"
>

  <!-- FECHAR -->
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="fecharMensagem()"
  >
  </button>

  <!-- ÍCONE -->
  <div class="alert-icon">
    <i [ngClass]="icone"></i>
  </div>

  <!-- MENSAGENS -->
  <div class="alert-message">

    <div *ngIf="titulo" class="fw-semibold mb-1">
      {{ titulo }}
    </div>

    <div *ngFor="let msg of mensagens">
      {{ msg }}
    </div>

  </div>

  <!-- BARRA DE CONTAGEM -->
  <div
    class="alert-progress"
    [ngClass]="'alert-progress-' + tipo"
    [style.animation-duration.ms]="tempoDuracao"
  >
  </div>

</div>
